[site]
header_text = "Download Mirrors (Direct Links)"  
section_div_class = "su-spoiler-content su-u-clearfix su-u-trim"

[download]
default_dir = "C:/Games"
subfolder_per_section = true

[providers]
preferred = "FuckingFast"

[behavior]
sequential = true
retries = 3
delay_between_files = 1.0

[browser]
headless = true            # try without a window first
timeout = 30               # seconds: page load, button wait, link wait
fallback_to_headed = true  # if headless fails before any success, retry with a window
headed_timeout = 120       # seconds allowed for the headed retry (time to tick a Cloudflare box)